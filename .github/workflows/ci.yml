name: CI

# The "a stranger clones this and runs npm test" channel. Until 2026-07-29 that
# channel was verified on exactly one machine — the author's — which is not a
# channel, it is a habit.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Read-only by default. This workflow only checks out and tests; it needs no
# write scope, and inheriting the repository default would grant more than that.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL and vitest 4 pulls rolldown/vite 8, which require
        # ^20.19.0 || >=22.12.0 — `npm ci` cannot even install there. The dev
        # toolchain's floor is not the PUBLISHED package's floor, though: the
        # tarball ships dist/ plus the MCP SDK and nothing else, so the consumer
        # channel is proven separately in the package job below.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The artifact rung, in TWO STAGES.
  #
  # Stage 1 builds and packs on a Node the toolchain can actually run, and
  # uploads the tarball. Stage 2 downloads it and consumes it on every Node a
  # user might have, INCLUDING ones that cannot build here: vitest 4 pulls
  # vite 8 (Node ^20.19 || >=22.12), so `npm ci` dies on 18 — but the shipped
  # tarball is only dist/ plus the MCP SDK. A single-stage job conflated the
  # toolchain's floor with the package's and could only ever test the former.
  #
  # This is what turns the engines field from a support statement into a
  # measurement.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run verify:pack
      # The second shipped artifact. It packs its own bundle, so it needs no
      # upload: the whole payload is built, extracted and launched in this job.
      - run: npm run verify:mcpb
      - run: npm pack --silent > .tgzname
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: "*.tgz"
          retention-days: 1

  # The live upstream contract. Nothing in CI ran `npm run smoke`, so its
  # assertions fired only when someone typed the command — and this is the only
  # rung that can redden four of this repo's own claims, each of which the
  # mocked suite can assert the REQUEST for and nothing more: the case-variant
  # name search (a DOL that matched differently would answer zero and the
  # request assertions would stay green), the `in`-array flag filter, the
  # inclusive `T23:59:59` bound form, and back_wages_summary's aggregate over
  # whole rows.
  #
  # Manual trigger, not every push: DOL rate-limits hard enough that a full run
  # plus a few ad-hoc queries draws a multi-minute stretch of 429s. Exit 2
  # (upstream unavailable) is distinct from exit 1 (a failed assertion), and
  # `continue-on-error` is deliberately absent so neither reads as a pass.
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # smoke.ts prints a skip notice and exits 0 with no key, which is right
      # for a contributor and wrong for a job whose green is read as evidence.
      # A skip is not a pass, so an absent secret fails here instead.
      - name: the key has to be present, or the rung measures nothing
        env:
          DOL_API_KEY: ${{ secrets.DOL_API_KEY }}
        run: |
          if [ -z "$DOL_API_KEY" ]; then
            echo "DOL_API_KEY secret is not set; npm run smoke would skip and exit 0."
            exit 1
          fi
      - run: npm run smoke
        env:
          DOL_API_KEY: ${{ secrets.DOL_API_KEY }}

  # Stage 2: what a stranger actually does — install the published tarball and
  # speak MCP to it. Node 18 is here and nowhere else, because this is the only
  # stage that does not need the dev toolchain.
  consume:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: consume the published tarball
        run: |
          tgz=$(ls *.tgz | head -1)
          echo "consuming $tgz on node $(node -v)"
          PACK_PROBE_TARBALL="$PWD/$tgz" node scripts/pack-probe.mjs
